<!-- زر الإطلاق الجانبي -->
<button
  class="btn shadow position-fixed end-0 translate-middle-y rounded-start-pill border chatwideget-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="text-primary bi bi-chat-dots" viewBox="0 0 16 16">
    <path d="M5 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
    <path d="M2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zM13 1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h.5c.276 0 .531.108.724.296l2.036 2.036 2.036-2.036A1 1 0 0 1 9.5 13H13a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z"/>
  </svg>
  <span class="visually-hidden">محادثة آلية</span>
</button>


<!-- نافذة الشات الجانبية (SideBar) -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- رأس النافذة -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="إغلاق"
    >
      <span class="visually-hidden">إغلاق</span>
    </button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="ai-chat-messages">
        <div class="bot-message">
            أهلاً بك! كيف يمكنني مساعدتك في محتوى هذه المنصة اليوم؟
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
        <input type="text" 
          id="ai-chat-input" 
          placeholder="اكتب سؤالك هنا..."
        >
        <button id="ai-chat-send-btn">
          إرسال
        </button>
    </div>
</div>
