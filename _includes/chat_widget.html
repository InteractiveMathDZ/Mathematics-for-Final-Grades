<!-- زر الإطلاق الجانبي -->
<button
  class="btn shadow position-fixed end-0 translate-middle-y rounded-start-pill border chatwideget-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" class="bi bi-chat" viewBox="0 0 22 22">
      <!-- Speech Bubble Outline -->
      <path stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 C 3 5.5, 11 5.5, 11 10.5 C 11 15.5, 3 15.5, 3 10.5 Z M 6 15.5 L 4.2 19 L 6 17.5 Z"/>
  </svg>

  <span class="visually-hidden">محادثة آلية</span>
</button>


<!-- نافذة الشات الجانبية (SideBar) -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- رأس النافذة -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="إغلاق"
    >
      <span class="visually-hidden">إغلاق</span>
    </button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="ai-chat-messages">
        <div class="bot-message">
            أهلاً بك! كيف يمكنني مساعدتك في محتوى هذه المنصة اليوم؟
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
        <input type="text" 
          id="ai-chat-input" 
          placeholder="اكتب سؤالك هنا..."
        >
        <button id="ai-chat-send-btn">
          إرسال
        </button>
    </div>
</div>
