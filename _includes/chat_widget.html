<!-- زر الإطلاق الجانبي -->
<button
  class="btn shadow position-fixed end-0 translate-middle-y rounded-start-pill border chatwideget-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="text-primary bi bi-list-ul" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
  </svg>
  محادثة آلية
  <!-- <span class="visually-hidden">محادثة آلية</span> -->
</button>

<!-- نافذة الشات الجانبية (SideBar) -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- رأس النافذة -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="إغلاق"
    >
      <span class="visually-hidden">إغلاق</span>
    </button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="ai-chat-messages">
        <div class="bot-message">
            أهلاً بك! كيف يمكنني مساعدتك في محتوى هذه المنصة اليوم؟
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
        <input type="text" 
          id="ai-chat-input" 
          placeholder="اكتب سؤالك هنا..."
        >
        <button id="ai-chat-send-btn">
          إرسال
        </button>
    </div>
</div>
