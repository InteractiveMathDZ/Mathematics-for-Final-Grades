<!-- زر الإطلاق الجانبي -->
<button
  class="btn shadow position-fixed start-0 top-50 translate-middle-y rounded-start-pill border sidebar-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="text-primary bi bi-list-ul" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
  </svg>
  <span class="visually-hidden">محادثة آلية</span>
</button>

<!-- نافذة الشات الجانبية (SideBar) -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- رأس النافذة -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="إغلاق"
    >
      <span class="visually-hidden">إغلاق</span>
    </button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="ai-chat-messages" style="flex: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px;">
        <div style="background: #e2e8f0; padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; align-self: flex-start;">
            أهلاً بك! كيف يمكنني مساعدتك في محتوى هذه المنصة اليوم؟
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div style="padding: 15px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 8px;">
        <input type="text" id="ai-chat-input" placeholder="اكتب سؤالك هنا..." style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px;">
        <button id="ai-chat-send-btn" style="background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">إرسال</button>
    </div>
</div>
