<!-- زر الإطلاق الجانبي -->
<button
  class="btn shadow position-fixed end-0 translate-middle-y rounded-start-pill border chatwideget-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#3b82f6" stroke-width="1.5" class="text-primary bi bi-list-ul">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
  </svg>
  <span class="visually-hidden">محادثة آلية</span>
</button>


<!-- نافذة الشات الجانبية (SideBar) -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- رأس النافذة -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="إغلاق"
    >
      <span class="visually-hidden">إغلاق</span>
    </button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <div id="ai-chat-messages">
        <div class="bot-message">
            أهلاً بك! كيف يمكنني مساعدتك في محتوى هذه المنصة اليوم؟
        </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
        <input type="text" 
          id="ai-chat-input" 
          placeholder="اكتب سؤالك هنا..."
        >
        <button id="ai-chat-send-btn">
          إرسال
        </button>
    </div>
</div>
